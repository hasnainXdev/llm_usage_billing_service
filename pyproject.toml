[project]
name = "llm-usage-billing-service"
version = "0.1.0"
description = "LLM usage metering and billing service — meters billable actions per tenant, enforces monthly quotas per plan, rolls usage into integer-micro cost figures, and upgrades plans via Stripe Checkout (test mode only)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.6.0",
    "asyncpg>=0.30.0",
    "stripe>=11.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]
